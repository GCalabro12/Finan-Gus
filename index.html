<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finan Gus</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/icono-32.png">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finan Gus">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#0f766e;--ac2:#e6f4f2;--ln:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8eaee;--mut:#9aa3b2;--ac:#2dd4bf;--ac2:#163a37;--ln:#2a313d}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:10px}
h1{margin:0;font-size:26px}.mut{color:var(--mut);font-size:14px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}.k b{display:block;font-size:20px;margin-top:4px}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.bar label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
select,input{padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px;width:100%}
.list{display:flex;flex-direction:column;gap:8px}
.f{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.f .em{font-weight:600}.f .im{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.f .acc{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.f .acc a{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--ac2);color:var(--ac);text-decoration:none;font-weight:600;font-size:14px}
</style>
</head>
<body><main>
<header>
 <img src="iconos/icono-192.png" alt="">
 <div><h1>Finan Gus</h1><div class="mut" id="upd"></div></div>
</header>

<div class="btns">
 <a class="btn pri" id="bDrive" href="https://drive.google.com/drive/folders/1l2nSztB64pz4uTjImbnbeK8-YXFZx8FU" target="_blank">📁 Facturas en Drive</a>
 <a class="btn" href="https://drive.google.com/drive/folders/16jVf4ak_lkrys4qYUT-lRox0aPGIR-mB" target="_blank">📂 2026</a>
 <a class="btn" href="https://drive.google.com/drive/folders/19AlkMT1l7RCok9nrFtrOmtVBZvBVXlqX" target="_blank">📂 2025</a>
 <a class="btn" href="https://drive.google.com/drive/folders/1vOYAay1CMkLLuEoLl0ig2_fS5KdF1zTz" target="_blank">🗂️ Carpeta Finan Gus</a>
 <button class="btn" id="bCsv">⬇️ Descargar listado</button>
 <button class="btn" id="bInst" hidden>📲 Instalar app</button>
</div>

<div id="login" class="btns" hidden><button class="btn pri" id="bLogin">🔐 Entrar con Google para ver las facturas</button></div>
<div class="kpis" id="kpis"></div>

<div class="bar">
 <label>Año<select id="anio"></select></label>
 <label>Desde<input type="date" id="desde"></label>
 <label>Hasta<input type="date" id="hasta"></label>
 <label>Emisor<input id="q" placeholder="Buscar…"></label>
</div>
<div class="list" id="lista"></div>
<p class="mut">＊ = descargada automáticamente por Claude desde Gmail.</p>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="datos.js" onerror="void 0"></script>
<script>
// ===== CONFIGURACIÓN =====
// ID de cliente OAuth de Google Cloud (tipo "Aplicación web", origen https://gcalabro12.github.io)
const CLIENT_ID = '223862340710-b307c1k6q39q44v2gdcbu17visdan9km.apps.googleusercontent.com';
const CARPETA_REGISTRO = '1QP5os2404HtZsksEzp1MknJDq94_cYJl'; // Finan Gus/registro
const CARPETA_FACTURAS = '1l2nSztB64pz4uTjImbnbeK8-YXFZx8FU'; // Finan Gus/Facturas
// =========================
let D={facturas:[]},F=[],LINKS={},vis=[],tok=null;
const n=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.')),eur=x=>x.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const fmt=d=>d.split('-').reverse().join('/');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cargar(datos){
 D=datos;F=D.facturas.sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('upd').textContent='Actualizado: '+(D.actualizado?fmt(D.actualizado):'—');
 $('anio').innerHTML='<option value="">Todos</option>'+[...new Set(F.map(f=>f.fecha.slice(0,4)))].sort().reverse().map(a=>`<option>${a}</option>`).join('');
 render();
}
function render(){
 const a=$('anio').value,de=$('desde').value,ha=$('hasta').value,t=$('q').value.toLowerCase();
 vis=F.filter(f=>(!a||f.fecha.startsWith(a))&&(!de||f.fecha>=de)&&(!ha||f.fecha<=ha)&&f.emisor.toLowerCase().includes(t));
 const tot=vis.reduce((s,f)=>s+n(f.importe),0),em={};vis.forEach(f=>em[f.emisor]=(em[f.emisor]||0)+n(f.importe));
 const top=Object.entries(em).sort((x,y)=>y[1]-x[1])[0];
 $('kpis').innerHTML=`<div class="k">Facturas<b>${vis.length}</b></div><div class="k">Total<b>${eur(tot)}</b></div><div class="k">Mayor proveedor<b>${top?esc(top[0]):'—'}</b></div><div class="k">Última<b>${vis[0]?fmt(vis[0].fecha):'—'}</b></div>`;
 $('lista').innerHTML=vis.map(f=>{const nom=f.archivo.split('/').pop(),L=LINKS[nom];
  const ver=L?L.view:'Facturas/'+encodeURI(f.archivo),bajar=L?L.down:ver;
  return `<div class="f"><div><div class="em">${esc(f.emisor)}</div><div class="mut">${fmt(f.fecha)} · Nº ${esc(f.numero)}</div></div><div class="im">${eur(n(f.importe))}</div>
  <div class="acc"><a href="${ver}" target="_blank">Ver</a><a href="${bajar}" download="${esc(nom)}" target="_blank">Descargar</a></div></div>`}).join('')||'<p class="mut">Sin facturas para este filtro.</p>';
}
async function api(path){const r=await fetch('https://www.googleapis.com/drive/v3/'+path,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error(r.status);return r;}
async function hijos(id,extra=''){const q=encodeURIComponent(`'${id}' in parents and trashed=false${extra}`);
 return (await (await api(`files?q=${q}&pageSize=1000&fields=files(id,name,mimeType,webViewLink,webContentLink)`)).json()).files;}
async function desdeDrive(){
 $('upd').textContent='Cargando desde Drive…';
 const reg=(await hijos(CARPETA_REGISTRO," and name='facturas.json'"))[0];
 const datos=await (await api(`files/${reg.id}?alt=media`)).json();
 for(const anio of await hijos(CARPETA_FACTURAS," and mimeType='application/vnd.google-apps.folder'"))
  for(const p of await hijos(anio.id)) LINKS[p.name]={view:p.webViewLink,down:p.webContentLink||p.webViewLink};
 datos.actualizado=datos.actualizado||new Date().toISOString().slice(0,10);
 $('login').hidden=true;cargar(datos);
}
function entrar(){
 const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.readonly',
  callback:r=>{if(r.access_token){tok=r.access_token;desdeDrive().catch(e=>$('upd').textContent='Error leyendo Drive ('+e.message+')');}}});
 c.requestAccessToken();
}
$('bLogin').onclick=()=>window.google?entrar():alert('Cargando Google, prueba en un segundo');
['anio','desde','hasta','q'].forEach(i=>$(i).addEventListener('input',render));
if(window.FINANGUS){cargar(window.FINANGUS);} // copia local (ordenador)
else{$('login').hidden=false;$('upd').textContent='Entra con tu cuenta de Google';render();}
$('bCsv').onclick=()=>{const c='Fecha;Emisor;Importe;Nº factura;Archivo\n'+vis.map(f=>[fmt(f.fecha),f.emisor,f.importe,f.numero,f.archivo.split('/').pop()].join(';')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='Finan Gus facturas.csv';a.click();};
let pi;addEventListener('beforeinstallprompt',e=>{e.preventDefault();pi=e;$('bInst').hidden=false;});
$('bInst').onclick=async()=>{if(pi){pi.prompt();await pi.userChoice;pi=null;$('bInst').hidden=true;}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script>
</body></html>
